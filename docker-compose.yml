
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alkausar-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - alkausar_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  alkausar_sql_data:
